<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garten of Gombo</title>
    
    <!-- 📦 SECURE LIBRARIES -->
    <script src="https://aframe.io"></script>
    <script src="https://cloudflare.com"></script>
    
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:monospace; user-select:none; -webkit-user-select:none; }
        #menu, #intro { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:99; color:white; background:#4a3425; text-align:center; }
        #intro { background:#000; display:none; padding:20px; }
        h1 { color:#e62e2e; font-size:32px; margin:0 0 20px 0; text-shadow: 2px 2px 0px #000; }
        button { background:#111; color:white; border:3px solid #e62e2e; padding:12px 30px; font-weight:bold; font-size:16px; margin:8px; border-radius:5px; position: relative; z-index:10; cursor:pointer; }
        
        .mural-wall {
            width: 85%;
            max-width: 450px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #f4edd2;
            border: 4px dashed #8b5a2b;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .drawing { border: 1px solid #ccc; background: #fff; font-size: 10px; font-weight: bold; text-align: center; padding: 4px 2px; box-shadow: 2px 2px 4px rgba(0,0,0,0.15); }
        .gombo-draw { color: #d62222; transform: rotate(-2deg); }
        .mohajush-draw { color: #1a7f1a; transform: rotate(2deg); }
        .zoyi-draw { color: #ff69b4; transform: rotate(-3deg); }
        .lenna-draw { color: #a020f0; transform: rotate(1deg); }
        .riddles-draw { color: #00ced1; transform: rotate(-1deg); }
        .mulyn-draw { color: #ff8c00; transform: rotate(3deg); }

        #clock-btn { background:#1a7f1a; border-radius:50%; width:100px; height:100px; font-size:24px; box-shadow:0 0 15px #1a7f1a; border:3px solid white; cursor:pointer; position: relative; z-index:20; }
        
        /* 🛠️ Fixed layout container to make the 3D scene fully display */
        #game-stage { display:none; width:100%; height:100%; position:absolute; top:0; left:0; z-index:50; }
        #joystick-zone { position:absolute; bottom:40px; left:40px; width:120px; height:120px; z-index:99; pointer-events: auto; }
        #ui { position:absolute; top:20px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,0.8); padding:10px; border:2px solid #d62222; z-index:99; pointer-events: none; }
        
        /* Ensure canvas fills screen perfectly */
        a-scene { width: 100% !important; height: 100% !important; display: block; }
    </style>
</head>
<body>

    <!-- 1. MAIN MENU SCREEN -->
    <div id="menu">
        <div class="mural-wall">
            <div class="drawing gombo-draw">👹<br>GOMBO</div>
            <div class="drawing mohajush-draw">🦍<br>MOHAJUSH</div>
            <div class="drawing zoyi-draw">🦩<br>ZOYI BIRD</div>
            <div class="drawing lenna-draw">👩‍🏫<br>LENNA</div>
            <div class="drawing riddles-draw">🐒<br>RIDDLES</div>
            <div class="drawing mulyn-draw">🪼<br>MULYN</div>
        </div>
        <h1>GARTEN OF GOMBO</h1>
        <button id="new-game">NEW GAME</button>
        <button onclick="alert('Created by: You!\nMascot Designs: Gombo, Huge Mohajush, Zoyi Bird, Gombolenna, Captain Riddles, Stinger Mulyn.\nBuilt with GitHub & iPad 🚀')">CREDITS</button>
    </div>

    <!-- 2. INTRO STORY SCREEN -->
    <div id="intro">
        <p style="font-size:18px; max-width:80%; line-height:1.5;">"For a parent looking for their missing child, time is a delicate matter."</p>
        <p style="color:#888; font-size:12px; margin-bottom:25px;">Tap the Mohajush Clock to Advance Time...</p>
        <button id="clock-btn">⏰</button>
    </div>

    <!-- 3. ACTIVE 3D GAME STAGE -->
    <div id="game-stage">
        <div id="joystick-zone"></div>
        <div id="ui">Daycare Entered. Find Gombo!</div>
        
        <!-- 🛠️ Embedded tag forces iPad to render objects immediately on display state change -->
        <a-scene embedded loading-screen="enabled:false">
            <a-sky color="#05060f"></a-sky>
            
            <!-- Bright fallback ambient and directional light systems so it isn't black -->
            <a-ambient-light color="#aaaaaa"></a-ambient-light>
            
            
            
                
                    <a-light type="spot" color="#fff" intensity="2" distance="25" angle="45"></a-light>
                
            

            <!-- Bright grid floor and visible test wall structures -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#3a3d40"></a-plane>
            <a-box position="0 2.5 -25" width="50" height="5" depth="1" color="#8b4513"></a-box>
            <a-box position="0 2.5 25" width="50" height="5" depth="1" color="#8b4513"></a-box>
            <a-box position="-25 2.5 0" width="1" height="5" depth="50" color="#8b4513"></a-box>
            <a-box position="25 2.5 0" width="1" height="5" depth="50" color="#8b4513"></a-box>

            <!-- Mascot: GOMBO (7ft Red Hamster-Human, Horns & Back Stitches) -->
            
                <a-box width="2" height="3.5" depth="1.8" color="#e62e2e"></a-box>
                <a-sphere position="-0.4 1 1" radius="0.2" color="#fff"></a-sphere>
                <a-sphere position="-0.4 1 1.1" radius="0.05" color="#000"></a-sphere>
                <a-sphere position="0.4 1 1" radius="0.2" color="#fff"></a-sphere>
                <a-sphere position="0.4 1 1.1" radius="0.05" color="#000"></a-sphere>
                <a-cone position="-0.7 1.8 0" radius-bottom="0.15" height="0.8" color="#222" rotation="0 0 15"></a-cone>
                <a-cone position="0.7 1.8 0" radius-bottom="0.15" height="0.8" color="#222" rotation="0 0 -15"></a-cone>
                <a-cone position="-0.75 2.2 0" radius-bottom="0.2" height="0.6" color="#ffff1a" rotation="0 0 15"></a-cone>
                <a-cone position="0.75 2.2 0" radius-bottom="0.2" height="0.6" color="#1affff" rotation="0 0 -15"></a-cone>
                <a-box position="0 0 -0.92" width="0.1" height="2.5" depth="0.05" color="#111"></a-box>
            
        </a-scene>
    </div>

    <!-- 🧠 GAME JAVASCRIPT MASTER CODE -->
    <script>
        let moveX = 0, moveZ = 0, gameRunning = false;

        function tap(id, action) {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('click', action);
                el.addEventListener('touchend', (e) => { e.preventDefault(); action(); });
            }
        }

        tap('new-game', () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('intro').style.display = 'flex';
        });

        tap('clock-btn', () => {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('game-stage').style.display = 'block';
            gameRunning = true;

            // 🛠️ Instantly wake up the A-Frame viewport sizes
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl) {
                sceneEl.resize();
            }
            window.dispatchEvent(new Event('resize'));

            // Initialize thumb stick controls safely
            if (typeof nipplejs !== 'undefined') {
                const nav = nipplejs.create({
                    zone: document.getElementById('joystick-zone'),
                    mode: 'static', position: { left: '60px', bottom: '60px' },
                    color: 'white', size: 100
                });
                nav.on('move', (evt, data) => {
                    if (data.vector) {
                        moveX = data.vector.x * 0.12;
                        moveZ = -data.vector.y * 0.12;
                    }
                });
                nav.on('end', () => { moveX = 0; moveZ = 0; });
            }
        });

        function loop() {
            if (gameRunning) {
                const p = document.querySelector('#player');
                if (p && (moveX !== 0 || moveZ !== 0)) {
                    let pos = p.getAttribute('position');
                    let cam = p.querySelector('[camera]');
                    let rot = cam ? cam.getAttribute('rotation') : { y: 0 };
                    let angle = (rot.y * Math.PI) / 180;
                    let cx = pos.x + (moveX * Math.cos(angle) + moveZ * Math.sin(angle));
                    let cz = pos.z + (-moveX * Math.sin(angle) + moveZ * Math.cos(angle));

                    if (Math.abs(cx) < 24 && Math.abs(cz) < 24) {
                        p.setAttribute('position', { x: cx, y: pos.y, z: cz });
                    }
                }
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
