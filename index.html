<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garten of Gombo</title>
    
    <!-- 📦 Raw Three.js library preloaded via safe fallback script links -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:monospace; user-select:none; -webkit-user-select:none; }
        #joystick-zone { position:absolute; bottom:40px; left:40px; width:120px; height:120px; z-index:999; pointer-events: auto; }
        #ui { position:absolute; top:20px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,0.8); padding:10px; border:2px solid #d62222; z-index:999; text-align:center; font-size:14px; pointer-events:none; width: 80%; max-width: 400px; border-radius: 4px; }
        #webgl-canvas { width: 100%; height: 100%; display: block; position: absolute; top:0; left:0; z-index: 1; }
    </style>
</head>
<body>

    <!-- 🎮 ZAKIR & MOHAMED DEV STUDIO UI OVERLAY -->
    <div id="joystick-zone"></div>
    <div id="ui">Zakir & Mohamed Dev Studio<br>Daycare Entered. Find Gombo!</div>
    
    <!-- 🛠️ RAW NATIVE GRAPHICS CANVAS LAYER -->
    <canvas id="webgl-canvas"></canvas>

    <script>
        let moveX = 0, moveZ = 0;
        const speed = 0.15;

        // 1. INITIALIZE NATIVE IPAD 3D ENVIRONMENT (THREE.JS)
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0e15); // Dark daycare atmosphere

        // Set up player camera position viewpoint
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 15);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 2. BRIGHT WHITE LIGHTING FALLBACKS (Guarantees no black screen shadows)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(-2, 4, 2);
        scene.add(directionalLight);

        // 3. GENERATE THE DAYCARE FLOORBOARDS
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x4a4e5a, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = Math.PI / 2;
        scene.add(floor);

        // 4. GENERATE PERIMETER BOUNDARY WALLS
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x8b5a2b });
        
        function makeWall(w, h, d, x, y, z) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const wall = new THREE.Mesh(geo, wallMat);
            wall.position.set(x, y, z);
            scene.add(wall);
        }
        makeWall(60, 5, 1, 0, 2.5, -30); // Back Wall
        makeWall(60, 5, 1, 0, 2.5, 30);  // Front Wall
        makeWall(1, 5, 60, -30, 2.5, 0); // Left Wall
        makeWall(1, 5, 60, 30, 2.5, 0);  // Right Wall

        // 5. CONSTRUCT MASCOT MONSTER: GOMBO (7ft Red Body)
        const gomboGroup = new THREE.Group();

        // Gombo Torso Box
        const bodyGeo = new THREE.BoxGeometry(2, 3.5, 1.8);
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xe62e2e }); // Bright Red
        const gomboBody = new THREE.Mesh(bodyGeo, bodyMat);
        gomboGroup.add(gomboBody);

        // Mascot Eyes
        const eyeGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pupilGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.position.set(-0.4, 1, 0.9);
        const leftPupil = new THREE.Mesh(pupilGeo, pupilMat); leftPupil.position.set(-0.4, 1, 0.96);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat); rightEye.position.set(0.4, 1, 0.9);
        const rightPupil = new THREE.Mesh(pupilGeo, pupilMat); rightPupil.position.set(0.4, 1, 0.96);
        gomboGroup.add(leftEye, leftPupil, rightEye, rightPupil);

        // Black Devil Horns
        const hornGeo = new THREE.ConeGeometry(0.15, 0.8, 16);
        const hornMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        const leftHorn = new THREE.Mesh(hornGeo, hornMat); leftHorn.position.set(-0.7, 1.8, 0); leftHorn.rotation.z = -0.2;
        const rightHorn = new THREE.Mesh(hornGeo, hornMat); rightHorn.position.set(0.7, 1.8, 0); rightHorn.rotation.z = 0.2;
        gomboGroup.add(leftHorn, rightHorn);

        // Two Neon Party Hats sitting on horns
        const hatGeo = new THREE.ConeGeometry(0.18, 0.6, 16);
        const hatMatYellow = new THREE.MeshPhongMaterial({ color: 0    xffff1a });
        const hatMatCyan = new THREE.MeshPhongMaterial({ color: 0x1affff });
        const leftHat = new THREE.Mesh(hatGeo, hatMatYellow); leftHat.position.set(-0.75, 2.2, 0); leftHat.rotation.z = -0.2;
        const rightHat = new THREE.Mesh(hatGeo, hatMatCyan); rightHat.position.set(0.75, 2.2, 0); rightHat.rotation.z = 0.2;
        gomboGroup.add(leftHat, rightHat);

        // Place Gombo on the map floorboards coordinates
        gomboGroup.position.set(0, 1.75, -5);
        scene.add(gomboGroup);

        // 6. INITIALIZE TOUCHSCREEN THUMB JOYSTICK CONTROLS
        window.addEventListener('load', () => {
            if (typeof nipplejs !== 'undefined') {
                const nav = nipplejs.create({
                    zone: document.getElementById('joystick-zone'),
                    mode: 'static', position: { left: '60px', bottom: '60px' },
                    color: 'white', size: 100
                });
                nav.on('move', (evt, data) => {
                    if (data.vector) {
                        moveX = data.vector.x * speed;
                        moveZ = -data.vector.y * speed;
                    }
                });
                nav.on('end', () => { moveX = 0; moveZ = 0; });
            }
        });

        // 7. CONTINUOUS RUNTIME FRAME GAME LOOP (60FPS Physics updates)
        function animate() {
            requestAnimationFrame(animate);

            // Smooth player translation coordinates updates
            if (moveX !== 0 || moveZ !== 0) {
                camera.position.x += moveX;
                camera.position.z += moveZ;

                // Stop Mohamed from drifting past the room walls boundaries limits bounds
                camera.position.x = Math.max(-28, Math.min(28, camera.position.x));
                camera.position.z = Math.max(-28, Math.min(28, camera.position.z));
            }

            renderer.render(scene, camera);
        }
        animate();

        // Safe layout adjustment scaling tracking rules parameters for rotations changes
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
