<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garten of Gombo</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:monospace; user-select:none; -webkit-user-select:none; }
        #ui { position:absolute; top:20px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,0.9); padding:12px; border:2px solid #d62222; z-index:99; text-align:center; font-size:14px; width:85%; max-width:400px; border-radius:4px; pointer-events:none; box-shadow: 0 0 10px rgba(214,34,34,0.5); }
        #canvas { display:block; width:100vw; height:100vh; background:#0a0a0f; }
        #controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; z-index:99; }
        .ctrl-btn { width:60px; height:60px; background:#222; color:white; border:2px solid #e62e2e; font-size:20px; font-weight:bold; border-radius:10px; display:flex; justify-content:center; align-items:center; }
        .ctrl-btn:active { background:#e62e2e; }
    </style>
</head>
<body>

    <!-- 🎮 ZAKIR & MOHAMED DEV STUDIO ADVANCED HUD -->
    <div id="ui">
        <b>Zakir & Mohamed Studio</b><br>
        <span id="task" style="color:#ffcc00;">Task: Find the Yellow Keycard on the radar map!</span><br>
        <span id="score" style="color:#ff69b4; display:none;">Eggs Collected: 0/7</span>
    </div>

    <canvas id="canvas"></canvas>

    <div id="controls">
        <div></div><div class="ctrl-btn" id="btn-up">▲</div><div></div>
        <div class="ctrl-btn" id="btn-left">◀</div><div></div><div class="ctrl-btn" id="btn-right">▶</div>
        <div></div><div class="ctrl-btn" id="btn-down">▼</div><div></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        // 🗺️ GAME STATE CONFIGURATIONS
        let pX = window.innerWidth / 2, pY = window.innerHeight - 100;
        const pRadius = 10;
        
        let hasKey = false, doorOpen = false, bats = 0, droneUnlocked = false;
        let eggsCollected = 0, zoyiFed = false;

        // Coordinates System
        let keyX = window.innerWidth / 2 - 80, keyY = window.innerHeight - 180;
        let doorY = window.innerHeight - 260;
        let b1X = window.innerWidth / 2 - 120, b1Y = window.innerHeight - 340;
        let b2X = window.innerWidth / 2 + 120, b2Y = window.innerHeight - 340;
        let gomboX = window.innerWidth / 2, gomboY = window.innerHeight - 440;

        // 🦩 Zoyi Bird Playground System Parameters
        let zoyiX = window.innerWidth / 2;
        let zoyiY = window.innerHeight - 600;
        
        // 7 Glowing Egg Locations (Scattered around Zoyi Bird's chamber)
        let eggs = [
            {x: zoyiX - 100, y: zoyiY + 50, found: false}, {x: zoyiX + 100, y: zoyiY + 50, found: false},
            {x: zoyiX - 120, y: zoyiY - 50, found: false}, {x: zoyiX + 120, y: zoyiY - 50, found: false},
            {x: zoyiX - 40,  y: zoyiY - 100, found: false}, {x: zoyiX + 40,  y: zoyiY - 100, found: false},
            {x: zoyiX,       y: zoyiY + 120, found: false}
        ];

        function move(dx, dy) {
            pX += dx; pY += dy;

            // Restrict Boundaries
            if (pX < 20) pX = 20; if (pX > canvas.width - 20) pX = canvas.width - 20;
            if (pY < 20) pY = 20; if (pY > canvas.height - 20) pY = canvas.height - 20;

            // Door Barrier block
            if (!doorOpen && pY - pRadius < doorY && pY + pRadius > doorY - 10) {
                pY = doorY + pRadius;
                document.getElementById('task').innerText = "Door Locked! Grab the Yellow Keycard first.";
            }

            // Task A: Yellow Keycard
            if (!hasKey && Math.hypot(pX - keyX, pY - keyY) < pRadius + 12) {
                hasKey = true;
                document.getElementById('task').innerHTML = "<span style='color:#00ff66;'>Task: Move up to open the Red Security Gate!</span>";
            }

            // Task B: Unlock Red Gate
            if (hasKey && !doorOpen && Math.abs(pY - doorY) < pRadius + 15 && Math.abs(pX - window.innerWidth/2) < 60) {
                doorOpen = true;
                document.getElementById('task').innerHTML = "<span style='color:#ffcc00;'>Task: Clear the center room to find 2 Green Drone Batteries!</span>";
            }

            // Task C: Find 2 Batteries
            if (doorOpen && !droneUnlocked) {
                if (b1X !== -100 && Math.hypot(pX - b1X, pY - b1Y) < pRadius + 12) { b1X = -100; bats++; }
                if (b2X !== -100 && Math.hypot(pX - b2X, pY - b2Y) < pRadius + 12) { b2X = -100; bats++; }
                if (bats === 2) {
                    droneUnlocked = true;
                    document.getElementById('task').innerHTML = "<span style='color:#ffcc00;'>DRONE ACTIVATED! Task: Head north to Zoyi Bird's Playroom Abyss!</span>";
                    document.getElementById('score').style.display = 'block';
                }
            }

            // Task D: Zoyi Bird's Playground Egg Hunt
            if (droneUnlocked && !zoyiFed) {
                // Hunt Eggs
                eggs.forEach(egg => {
                    if (!egg.found && Math.hypot(pX - egg.x, pY - egg.y) < pRadius + 12) {
                        egg.found = true;
                        eggsCollected++;
                        document.getElementById('score').innerText = `Eggs Collected: ${eggsCollected}/7`;
                    }
                });

                // Return and Feed Zoyi Bird Beak
                if (eggsCollected === 7) {
                    document.getElementById('task').innerHTML = "<span style='color:#ffcc00;'>Task: You have all 7 eggs! Move to Zoyi Bird's center blue beak circle!</span>";
                    if (Math.hypot(pX - zoyiX, pY - zoyiY) < pRadius + 25) {
                        zoyiFed = true;
                        document.getElementById('task').innerHTML = "<span style='color:#00ff66;'>PURPLE KEYCARD UNLOCKED! Zakir & Mohamed Dev Studio Victory! 🏆</span>";
                    }
                }
            }
        }

        function setupTouch(id, dx, dy) {
            const btn = document.getElementById(id); let timer;
            function start(e) { e.preventDefault(); timer = setInterval(() => { move(dx, dy); }, 20); }
            function stop() { clearInterval(timer); }
            btn.addEventListener('touchstart', start); btn.addEventListener('touchend', stop);
            btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', stop);
        }
        setupTouch('btn-up', 0, -5); setupTouch('btn-down', 0, 5); setupTouch('btn-left', -5, 0); setupTouch('btn-right', 5, 0);

        // 🎨 RENDERING LOOPS
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Floor Grids Layout
            ctx.strokeStyle = '#222530'; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

            // Perimeter Walls
            ctx.strokeStyle = '#7a4928'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);

            // Starting Gates
            ctx.strokeStyle = '#4a2e80'; ctx.lineWidth = 6; ctx.beginPath();
            ctx.moveTo(0, doorY); ctx.lineTo(canvas.width / 2 - 50, doorY);
            ctx.moveTo(canvas.width / 2 + 50, doorY); ctx.lineTo(canvas.width, doorY); ctx.stroke();

            if (!doorOpen) { ctx.strokeStyle = '#cc2222'; ctx.beginPath(); ctx.moveTo(canvas.width / 2 - 50, doorY); ctx.lineTo(canvas.width / 2 + 50, doorY); ctx.stroke(); }

            // Keycard Target Dot
            if (!hasKey) { ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(keyX, keyY, 8, 0, Math.PI*2); ctx.fill(); }

            // Battery Target Dots
            ctx.fillStyle = '#00ff66';
            if (b1X !== -100) { ctx.beginPath(); ctx.arc(b1X, b1Y, 8, 0, Math.PI*2); ctx.fill(); }
            if (b2X !== -100) { ctx.beginPath(); ctx.arc(b2X, b2Y, 8, 0, Math.PI*2); ctx.fill(); }

            // Mascot Box: GOMBO
            ctx.fillStyle = '#e62e2e'; ctx.fillRect(gomboX - 20, gomboY - 20, 40, 40);
            ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText('👹 GOMBO', gomboX - 22, gomboY + 5);

            // 🦩 MASCOT ZONE: ZOYI BIRD PLAYGROUND ABYSS
            if (droneUnlocked) {
                // Draw Zoyi's Massive Beak Target Chute
                ctx.fillStyle = zoyiFed ? '#00ff66' : '#ff69b4';
                ctx.beginPath(); ctx.arc(zoyiX, zoyiY, 25, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#000'; ctx.font = '10px monospace'; ctx.fillText('🦩 ZOYI', zoyiX - 18, zoyiY + 4);

                // Draw 7 Magenta Eggs dots setup
                ctx.fillStyle = '#ff00ff';
                eggs.forEach(egg => {
                    if (!egg.found) { ctx.beginPath(); ctx.arc(egg.x, egg.y, 6, 0, Math.PI*2); ctx.fill(); }
                });
            }

            // Player User Circle
            ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(pX, pY, pRadius, 0, Math.PI * 2); ctx.fill();

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
