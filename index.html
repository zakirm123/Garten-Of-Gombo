<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garten of Gombo</title>
    <script src="https://aframe.io"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; user-select: none; -webkit-user-select: none; }
        
        /* Fixed Background Layout and Color Adjustments */
        #menu, #intro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99; color: white; background: #4a3425; text-align: center; }
        #intro { background: #000; display: none; padding: 20px; box-sizing: border-box; }
        
        /* Character Drawing Sketch Mural Displays */
        .mural-wall {
            width: 85%;
            height: 30%;
            margin-bottom: 20px;
            background: #f4edd2;
            border: 4px dashed #8b5a2b;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 8px;
            box-sizing: border-box;
        }
        .drawing { border: 1px solid #ccc; background: #fff; font-size: 10px; font-weight: bold; text-align: center; padding: 3px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
        .gombo-draw { color: #d62222; transform: rotate(-2deg); }
        .mohajush-draw { color: #1a7f1a; transform: rotate(3deg); }
        .zoyi-draw { color: #ff69b4; transform: rotate(-3deg); }
        .lenna-draw { color: #a020f0; transform: rotate(2deg); }
        .riddles-draw { color: #00ced1; transform: rotate(-1deg); }
        .mulyn-draw { color: #ff8c00; transform: rotate(4deg); }

        h1 { color: #e62e2e; font-size: 32px; margin-bottom: 25px; text-shadow: 2px 2px 0px #000; }
        button { background: #111; color: white; border: 3px solid #e62e2e; padding: 12px 30px; font-weight: bold; border-radius: 5px; margin: 8px; font-size: 16px; }
        
        #clock-btn { background: #1a7f1a; border-radius: 50%; width: 100px; height: 100px; font-size: 24px; box-shadow: 0 0 15px #1a7f1a; border: 3px solid #fff; }
        #game-stage { display: none; width: 100%; height: 100%; position: relative; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; z-index: 99; }
        
        /* Drone Overlay Control Interface Configuration */
        #drone-ui { position: absolute; bottom: 40px; right: 40px; display: flex; flex-direction: column; gap: 12px; z-index: 99; }
        .action-btn { background: #222; color: #fff; border: 3px solid #ffcc00; padding: 14px; font-weight: bold; border-radius: 6px; }
        
        #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #d62222; z-index: 99; }
    </style>
</head>
<body>

    <!-- 1. MAIN MENU SCREEN -->
    <div id="menu">
        <!-- Re-adding Character Drawings to the Wall Backing -->
        <div class="mural-wall">
            <div class="drawing gombo-draw">👹<br>GOMBO</div>
            <div class="drawing mohajush-draw">🦍<br>MOHAJUSH</div>
            <div class="drawing zoyi-draw">🦩<br>ZOYI BIRD</div>
            <div class="drawing lenna-draw">👩‍🏫<br>LENNA</div>
            <div class="drawing riddles-draw">🐒<br>RIDDLES</div>
            <div class="drawing mulyn-draw">🪼<br>MULYN</div>
        </div>
        <h1>GARTEN OF GOMBO</h1>
        <button id="new-game">NEW GAME</button>
        <button id="credits" onclick="alert('Created by: You!\nMascot Designs: Gombo, Huge Mohajush, Zoyi Bird, Gombolenna, Captain Riddles, Stinger Mulyn.\nBuilt with GitHub & iPad 🚀')">CREDITS</button>
    </div>

    <!-- 2. INTRO NARRATIVE OVERLAY -->
    <div id="intro">
        <p style="font-size: 18px; max-width: 80%;">"For a parent looking for their missing child, time is a delicate matter."</p>
        <p style="color: #888; font-size: 12px;">Tap the Mohajush Clock to Advance Time...</p>
        <button id="clock-btn">⏰</button>
    </div>

    <!-- 3. ACTIVE 3D GAME STAGE -->
    <div id="game-stage">
        <div id="joystick-zone"></div>
        
        <!-- Drone UI Interaction Mechanics -->
        <div id="drone-ui">
            <button id="drone-summon-btn">📶 SUMMON DRONE</button>
            <button id="drone-click-btn">🎯 SEND TO WALL</button>
        </div>

        <div id="ui">Daycare Entered. Use Drone on the Red Button!</div>
        
        <a-scene embedded loading-screen="enabled: false">
            <a-sky color="#05060f"></a-sky>
            <a-ambient-light color="#888"></a-ambient-light>
            
            
                
                    <a-light type="spot" color="#fff" intensity="2" distance="20"></a-light>
                
            

            <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#3c3f4a"></a-plane>
            <a-box position="0 2.5 -25" width="50" height="5" depth="1" color="#5c3f2e"></a-box>
            <a-box position="0 2.5 25" width="50" height="5" depth="1" color="#5c3f2e"></a-box>
            <a-box position="-25 2.5 0" width="1" height="5" depth="50" color="#5c3f2e"></a-box>
            <a-box position="25 2.5 0" width="1" height="5" depth="50" color="#5c3f2e"></a-box>

            <!-- Target Puzzle Wall Switch Console Box -->
            <a-box id="puzzle-button" position="0 2 -2" width="0.8" height="0.8" depth="0.2" color="#ff0000"></a-box>

            <!-- Drone Device Entity Object Model -->
            
                <a-box width="0.6" height="0.3" depth="0.6" color="#ffcc00"></a-box>
                <a-sphere position="0 0 0.3" radius="0.1" color="#fff"></a-sphere>
            

            <!-- GOMBO MODEL (Red Mascot, Horns & Back Stitches) -->
            
                <a-box width="2" height="3.5" depth="1.8" color="#e62e2e"></a-box>
                <a-sphere position="-0.4 1 1" radius="0.2" color="#fff"></a-sphere>
                <a-sphere position="-0.4 1 1.1" radius="0.05" color="#000"></a-sphere>
                <a-sphere position="0.4 1 1" radius="0.2" color="#fff"></a-sphere>
                <a-sphere position="0.4 1 1.1" radius="0.05" color="#000"></a-sphere>
                <a-cone position="-0.7 1.8 0" radius-bottom="0.15" height="0.8" color="#222" rotation="0 0 15"></a-cone>
                <a-cone position="0.7 1.8 0" radius-bottom="0.15" height="0.8" color="#222" rotation="0 0 -15"></a-cone>
                <a-cone position="-0.75 2.2 0" radius-bottom="0.2" height="0.6" color="#ffff1a" rotation="0 0 15"></a-cone>
                <a-cone position="0.75 2.2 0" radius-bottom="0.2" height="0.6" color="#1affff" rotation="0 0 -15"></a-cone>
                <a-box position="0 0 -0.92" width="0.1" height="2.5" depth="0.05" color="#111"></a-box>
            
        </a-scene>
    </div>

    <script>
        let moveX = 0, moveZ = 0;
        const speed = 0.12;
        let gameRunning = false;
        let droneActive = false;

        function tap(id, action) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('click', action);
            el.addEventListener('touchend', (e) => { e.preventDefault(); action(); });
        }

        tap('new-game', () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('intro').style.display = 'flex';
        });

        tap('clock-btn', () => {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('game-stage').style.display = 'block';
            gameRunning = true;

            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 50);

            if (typeof nipplejs !== 'undefined') {
                const nav = nipplejs.create({
                    zone: document.getElementById('joystick-zone'),
                    mode: 'static', position: { left: '60px', bottom: '60px' },
                    color: 'white', size: 100
                });
                nav.on('move', (evt, data) => {
                    if (data.vector) {
                        moveX = data.vector.x * speed;
                        moveZ = -data.vector.y * speed;
                    }
                });
                nav.on('end', () => { moveX = 0; moveZ = 0; });
            }
        });

        // Drone Interactive Commands Execution System
        tap('drone-summon-btn', () => {
            const p = document.querySelector('#player');
            const d = document.querySelector('#player-drone');
            if(p && d) {
                let pos = p.getAttribute('position');
                d.setAttribute('position', {x: pos.x, y: 2.2, z: pos.z - 2});
                droneActive = true;
                document.getElementById('ui').innerText = "Drone deployed! Aim camera and click target button.";
            }
        });

        tap('drone-click-btn', () => {
            const d = document.querySelector('#player-drone');
            if(d && droneActive) {
                d.setAttribute('animation', 'property: position; to: 0 2 -1.5; dur: 1500; easing: easeOutQuad');
                setTimeout(() => {
