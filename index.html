<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garten of Gombo</title>
    
    <!-- 📦 LOAD LIBRARIES DIRECTLY -->
    <script src="https://aframe.io"></script>
    <script src="https://cloudflare.com"></script>
    
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:monospace; user-select:none; -webkit-user-select:none; }
        #joystick-zone { position:absolute; bottom:40px; left:40px; width:120px; height:120px; z-index:999; pointer-events: auto; }
        #ui { position:absolute; top:20px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,0.8); padding:10px; border:2px solid #d62222; z-index:999; text-align:center; font-size:14px; pointer-events:none; width: 80%; max-width: 400px; border-radius: 4px; }
        a-scene { width: 100% !important; height: 100% !important; display: block; }
    </style>
</head>
<body>

    <!-- 🎮 GAMEPLAY INTERFACE OVERLAY -->
    <div id="joystick-zone"></div>
    <div id="ui">Zakir & Mohamed Dev Studio<br>Daycare Entered. Find Gombo!</div>
    
    <!-- 🛠️ DIRECT RENDER SCENE: iPad forces WebGL on immediately -->
    <a-scene embedded loading-screen="enabled:false">
        <a-sky color="#0d0e15"></a-sky>
        
        <!-- Bright White Light systems to guarantee visibility on iPad screens -->
        
        
        
        
            
        

        <!-- Daycare Playroom Floor Layout -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#4a4e5a"></a-plane>
        
        <!-- Nursery Boundary Walls -->
        <a-box position="0 2.5 -30" width="60" height="5" depth="1" color="#8b5a2b"></a-box>
        <a-box position="0 2.5 30" width="60" height="5" depth="1" color="#8b5a2b"></a-box>
        <a-box position="-30 2.5 0" width="1" height="5" depth="60" color="#8b5a2b"></a-box>
        <a-box position="30 2.5 0" width="1" height="5" depth="60" color="#8b5a2b"></a-box>

        <!-- Mascot: GOMBO (7ft, Red, Devil Horns, 2 Party Hats & Back Stitches) -->
        
            <a-box width="2" height="3.5" depth="1.8" color="#e62e2e"></a-box>
            <a-sphere position="-0.4 1 1" radius="0.2" color="#fff"></a-sphere>
            <a-sphere position="-0.4 1 1.1" radius="0.05" color="#000"></a-sphere>
            <a-sphere position="0.4 1 1" radius="0.2" color="#fff"></a-sphere>
            <a-sphere position="0.4 1 1.1" radius="0.05" color="#000"></a-sphere>
            <a-cone position="-0.7 1.8 0" radius-bottom="0.15" height="0.8" color="#222" rotation="0 0 15"></a-cone>
            <a-cone position="0.7 1.8 0" radius-bottom="0.15" height="0.8" color="#222" rotation="0 0 -15"></a-cone>
            <a-cone position="-0.75 2.2 0" radius-bottom="0.18" height="0.6" color="#ffff1a" rotation="0 0 15"></a-cone>
            <a-cone position="0.75 2.2 0" radius-bottom="0.18" height="0.6" color="#1affff" rotation="0 0 -15"></a-cone>
            <!-- Back Stitches -->
            <a-box position="0 0 -0.92" width="0.1" height="2.5" depth="0.05" color="#111"></a-box>
        
    </a-scene>

    <script>
        let moveX = 0, moveZ = 0;
        const walkSpeed = 0.14;

        // Force viewport sizing update immediately on page initialization
        window.addEventListener('load', () => {
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl) {
                sceneEl.resize();
            }
            window.dispatchEvent(new Event('resize'));

            // Set up virtual joystick controls seamlessly
            if (typeof nipplejs !== 'undefined') {
                const nav = nipplejs.create({
                    zone: document.getElementById('joystick-zone'),
                    mode: 'static', position: { left: '60px', bottom: '60px' },
                    color: 'white', size: 100
                });
                nav.on('move', (evt, data) => {
                    if (data.vector) {
                        moveX = data.vector.x * walkSpeed;
                        moveZ = -data.vector.y * walkSpeed;
                    }
                });
                nav.on('end', () => { moveX = 0; moveZ = 0; });
            }
        });

        function loop() {
            const p = document.querySelector('#player');
            if (p && (moveX !== 0 || moveZ !== 0)) {
                let pos = p.getAttribute('position');
                let cam = p.querySelector('[camera]');
                let rot = cam ? cam.getAttribute('rotation') : { y: 0 };
                let angle = (rot.y * Math.PI) / 180;
                let cx = pos.x + (moveX * Math.cos(angle) + moveZ * Math.sin(angle));
                let cz = pos.z + (-moveX * Math.sin(angle) + moveZ * Math.cos(angle));

                if (Math.abs(cx) < 24 && Math.abs(cz) < 24) {
                    p.setAttribute('position', { x: cx, y: pos.y, z: cz });
                }
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
