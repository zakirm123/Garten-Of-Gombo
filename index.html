<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garten of Gombo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. MAIN TITLE ENTRY SCREEN -->
    <div id="start-screen" style="display: flex;">
        <div class="mural-wall">
            <div class="drawing gombo-draw">👹<br>GOMBO</div>
            <div class="drawing mohajush-draw">🦍<br>HUGE MOHAJUSH</div>
            <div class="drawing zoyi-draw">🦩<br>ZOYI BIRD</div>
            <div class="drawing lenna-draw">👩‍🏫<br>GOMBOLENNA</div>
            <div class="drawing riddles-draw">🐒<br>CAPT. RIDDLES</div>
            <div class="drawing mulyn-draw">🪼<br>STINGER BULYN</div>
        </div>

        <div class="menu-box">
            <h1>GARTEN OF GOMBO</h1>
            <div class="btn-group">
                <button class="menu-btn" id="new-game-btn">NEW GAME</button>
                <button class="menu-btn" id="continue-btn" disabled>CONTINUE GAME</button>
                <button class="menu-btn" id="settings-btn">SETTINGS</button>
                <button class="menu-btn" id="credits-btn">CREDITS</button>
                <button class="menu-btn" id="quit-btn">QUIT</button>
            </div>
        </div>
    </div>

    <!-- 2. NARRATIVE TEXT PROMPT OVERLAY -->
    <div id="intro-screen" style="display: none;">
        <div class="intro-textbox">
            <p id="intro-text">"For a parent looking for their missing child, time is a delicate matter."</p>
            <div id="clock-prompt">Tap the Mohajush Clock to Advance Time...</div>
        </div>
        <button id="mohajush-clock-btn">⏰<br><span>MOHAJUSH</span></button>
    </div>

    <script src="game.js"></script>
</body>
</html>
